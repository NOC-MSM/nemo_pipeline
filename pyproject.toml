[project]
name = "nemo_pipeline"
description = "NEMO Pipeline is a Python library dedicated to building reproducible data pipelines for calculating offline diagnostics using NEMO ocean general circulation model outputs."
keywords = ["NEMO", "oceanography", "modelling", "analysis", "data", "pipelines", "diagnostics"]
classifiers = [
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
version = "0.1.0"
authors = [{email = "oliver.tooth@noc.ac.uk"},{name = "Ollie Tooth"}]
maintainers = [{name = "Ollie Tooth", email = "oliver.tooth@noc.ac.uk"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "typer",
  "pydantic",
  "dask[complete]>=2024.10.0",
  "gsw>=3.6.19",
  "netcdf4",
  "numpy>=1.26.4",
  "xarray[accel]>=2024.10.0",
  "zarr>=2.18.3",
  ]

[project.urls]
Repository = "https://github.com/NOC-MSM/nemo_pipeline"

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77.0.3", "setuptools-scm>=8"]

[tool.setuptools]
packages = ["nemo_pipeline"]

[project.scripts]
nemo_pipeline = "nemo_pipeline.cli:app"
